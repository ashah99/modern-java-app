#spring.datasource.url=jdbc:h2:mem:contactdb;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
#Keep the H2 database running on exit for file based DB
spring.datasource.url=jdbc:h2:file:./data/contactdb;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# Force the console to be visible
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
# Ensure the port is 8080
server.port=8080



